[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvehub-ingestion"
version = "0.1.0"
description = "Ingestão segura e auditável de documentos do ResolveHub"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
documents = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
]
database = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
resolvehub-ingestion = "resolvehub_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
